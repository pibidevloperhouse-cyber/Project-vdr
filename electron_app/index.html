<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; frame-src 'self' data: blob:;">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            color: white;
            font-family: sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: #2d2d2d;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .login-box input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            background: #1e1e1e;
            color: white;
            border-radius: 4px;
        }

        .btn {
            background: #007acc;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            filter: brightness(1.2);
        }

        .hidden {
            display: none !important;
        }

        #main-app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 🔥 THE NEW TAB WORKSPACE STYLES */
        #tab-bar {
            display: flex;
            gap: 5px;
            padding: 8px 10px 0;
            overflow-x: auto;
            height: 35px;
            align-items: flex-end;
            background: #151515;
            border-bottom: 2px solid #333;
        }

        .vdr-tab {
            background: #2d2d2d;
            color: #999;
            padding: 6px 15px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12.5px;
            max-width: 220px;
            font-weight: bold;
            border: 1px solid #333;
            border-bottom: none;
        }

        .vdr-tab.active {
            background: #3d3d3d;
            color: white;
            border-color: #555;
        }

        .vdr-tab-close {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .vdr-tab-close:hover {
            color: #ff4d4d;
        }

        .vdr-tab-add {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 22px;
            padding: 0 12px;
            font-weight: bold;
            line-height: 1;
        }

        .vdr-tab-add:hover {
            color: white;
        }

        .toolbar {
            height: 60px;
            background: #2d2d2d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid #444;
            z-index: 10;
        }

        #viewer-container {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            position: relative;
        }

        /* Ensures absolute watermark wrapper fits properly */
        .document-tab-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

<body>
    <div id="login-screen" class="hidden">
        <div class="login-box">
            <h2>Secure VDR Login</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button id="login-btn" class="btn" style="width: 100%; margin-top: 15px;">Authenticate</button>
            <div id="login-error" style="color: #ff4d4d; margin-top: 10px;"></div>
        </div>
    </div>

    <div id="auth-screen" class="hidden">
        <div class="login-box">
            <h2 style="color: #007acc; margin-top:0;">System Ready</h2>
            <p>Logged in as: <b id="user-email-display"></b></p>
            <button id="open-file-btn" class="btn" style="background: #28a745; width: 100%; margin-top: 15px;">📂 Browse
                & Open .vdr File</button>
            <button id="logout-btn" class="btn" style="background: #dc3545; width: 100%; margin-top: 10px;">Log
                Out</button>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <div id="tab-bar"></div>

        <div class="toolbar">
            <h3 id="doc-title"
                style="margin: 0; font-size: 16px; color: #ccc; max-width: 50%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                Secure Viewer</h3>
            <div style="display: flex; gap: 10px;">
                <button id="edit-txt-btn" class="btn hidden" style="background: #ffc107; color: black;">✏️ Edit
                    Text</button>
                <div id="edit-txt-tools" class="hidden" style="display: flex; gap: 10px; align-items: center;">
                    <span style="color: #ffc107; font-size: 14px;">Editing Unlocked!</span>
                    <button id="save-txt-btn" class="btn" style="background: #28a745;">💾 Save Changes</button>
                </div>
                <button id="checkout-office-btn" class="btn hidden" style="background: #007acc;">📝 Edit in MS
                    Office</button>
                <button id="close-file-btn" class="btn" style="background: #dc3545;">✖ Close File</button>
            </div>
        </div>
        <div id="viewer-container"></div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
